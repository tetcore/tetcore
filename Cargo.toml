[package]
name = "tetcore"
description = "Tetcore - The Sovereign Execution Framework for Intelligence Infrastructure"
license-file = "LICENSE"
homepage = "https://tetcore.org"
repository = "https://github.com/tetcore/tetcore"
authors = ["Tetcore <support@tetcore.org>"]
edition = "2021"
version = "0.1.1"

[workspace]
members = [
    "tetcore-primitives",
    "tetcore-kernel",
    "tetcore-runtime",
    "tetcore-vm",
    "tetcore-node",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Tetcore Team"]
license = "MIT"
description = "Tetcore - The Sovereign Execution Framework"
repository = "https://github.com/tetcore/tetcore"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.0", features = ["serde", "rand_core"] }
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
