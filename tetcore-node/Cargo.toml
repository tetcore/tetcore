[package]
name = "tetcore-node"
version.workspace = true
edition.workspace = true
description = "Tetcore Node - Full node implementation for the Sovereign Execution Framework"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tetcore-primitives = { path = "../tetcore-primitives", version = "0.1.0" }
tetcore-kernel = { path = "../tetcore-kernel", version = "0.1.0" }
tetcore-runtime = { path = "../tetcore-runtime", version = "0.1.0" }
tetcore-vm = { path = "../tetcore-vm", version = "0.1.0" }
serde = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }

[features]
default = ["std"]
std = ["serde/std"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "tetcore"
path = "src/main.rs"
doc = false
